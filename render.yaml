# render.yaml – Infrastructure as Code dla Render.com
# Dokumentacja: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: flashcards-api
    runtime: image
    image:
      url: ghcr.io/zakpawel/flashcards-api:latest
      creds:
        fromRegistryCreds:
          name: ghcr PAT credential
    plan: free                        # zmień na "starter" / "standard" dla produkcji
    region: frankfurt                 # eu-central
    healthCheckPath: /                # health check
    envVars:
      - key: PORT
        value: "8080"
      # Internal Database URL of the Render Postgres instance (fishapp_36du).
      # Set manually in the dashboard; never commit it.
      - key: DATABASE_URL
        sync: false
      # Password reset emails (Brevo HTTP API; Render's free tier blocks SMTP).
      # Set both in the dashboard; never commit them. Without them, reset emails are not sent.
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM            # sender address verified in Brevo
        sync: false
